# Configuração do nginx que serve o SPA (docker/web.Dockerfile) e repassa a
# API na MESMA origem.
#
# Por que origem única: o refresh token é um cookie `SameSite=Lax`. Com o front
# num domínio e a API em outro, o navegador não manda esse cookie no refresh e
# a sessão cai 15 minutos depois do login. Servindo tudo pelo mesmo host o
# problema deixa de existir — e, de quebra, o bundle não precisa de nenhuma URL
# absoluta cravada nele (`VITE_API_URL=/api`), então a MESMA imagem roda em
# qualquer domínio: túnel temporário hoje, domínio definitivo depois, sem
# rebuild.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        # O nginx resolve o nome do upstream UMA vez, no boot, quando ele
        # aparece direto no proxy_pass ou num bloco `upstream`. Como o IP do
        # container da API muda a cada `docker restart`, isso vira 502 até
        # alguém reiniciar o nginx também. Com o nome numa variável + resolver,
        # a resolução acontece por requisição e o restart da API deixa de
        # derrubar o front.
        #
        # Os dois valores vêm do ambiente porque mudam conforme onde a stack
        # roda, e errar qualquer um deles dá 502 sem explicar o motivo:
        #
        #   Docker Compose  resolver 127.0.0.11 (DNS embutido do Docker), IPv4
        #   Railway         DNS da plataforma, rede privada só IPv6 — o
        #                   `ipv6=off` do compose IMPEDIRIA a resolução lá
        #
        # Endereço IPv6 aqui vai ENTRE COLCHETES: `resolver [fd12::10];`. Sem
        # eles o nginx nem sobe, e a mensagem não diz que o problema é esse.
        #
        # Os padrões abaixo (no web.Dockerfile) são os do compose, então o
        # ambiente atual não precisa definir nada.
        resolver ${EDS_RESOLVER};
        set $eds_api ${EDS_API_UPSTREAM};

        # Remove o prefixo /api: o navegador chama /api/auth/login e a API
        # recebe /auth/login — nenhuma rota do backend precisou mudar. (Com
        # variável no proxy_pass o corte por barra final não acontece
        # sozinho, daí o rewrite explícito.)
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$eds_api;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # O TRUST_PROXY=1 da API lê este header para o rate limit contar por
        # cliente real, e não tratar todo o tráfego como um IP só (o do nginx).
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Exportações de relatório e uploads podem demorar mais que o padrão
        # de 60s do nginx.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;

        # Uploads de anexo (holerite, documento de contrato) passam por aqui;
        # o limite global de 1m abaixo é para o SPA.
        client_max_body_size 25m;
    }

    # O React Router faz roteamento no cliente: um F5 em /obras/123 chega aqui
    # como um path que não existe em disco. Sem este fallback o usuário leva
    # 404 em qualquer rota que não seja a raiz.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Os assets buildados pelo Vite têm hash no nome (app-a1b2c3.js), então
    # podem ser cacheados para sempre — uma versão nova gera um nome novo.
    location /assets/ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # O index.html NUNCA pode ser cacheado: é ele que aponta para o hash atual
    # dos assets. Um index velho em cache serve um app velho após o deploy.
    # (os headers de segurança são repetidos aqui de propósito: um `add_header`
    # dentro de um location descarta todos os herdados do bloco server)
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml font/woff2;

    # A API já manda os próprios headers de segurança (helmet) nas respostas
    # de /api; estes cobrem o que é servido por aqui, o HTML/JS do SPA.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    server_tokens off;
    client_max_body_size 1m;
}
