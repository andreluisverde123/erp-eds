# Stack de produção (API + web) servida em ORIGEM ÚNICA: só o nginx do serviço
# `web` fica exposto, e ele repassa /api para a API. Isso resolve o cookie de
# refresh (SameSite=Lax) e mantém o bundle livre de qualquer URL absoluta —
# a mesma imagem roda em qualquer domínio.
#
# Rode a partir da RAIZ do monorepo:
#
#   docker compose -f docker/docker-compose.prod.yml --env-file .env.prod up -d --build
#
# Para publicar numa URL HTTPS temporária, sem domínio próprio, some
# `--profile tunnel` (ver o serviço `tunnel` abaixo).
#
# O banco NÃO faz parte da stack por padrão — em produção ele é o Neon
# (DATABASE_URL/DIRECT_URL apontando para lá). O serviço `postgres` abaixo está
# atrás do profile `local-db` e existe só para subir a stack inteira numa
# máquina só (homologação, demo offline):
#
#   docker compose -f docker/docker-compose.prod.yml --profile local-db up -d --build
#
# Antes do primeiro `up` (e depois de toda mudança de schema), aplique as
# migrations com a imagem `migrate` — ver docs/deploy.md.

name: eds

services:
  api:
    build:
      context: ..
      dockerfile: docker/api.Dockerfile
    restart: unless-stopped
    init: true # PID 1 correto: SIGTERM chega ao Node e o shutdown fica limpo.
    environment:
      NODE_ENV: production
      PORT: 3000
      # O nginx do serviço `web` fica na frente da API em qualquer deploy real.
      TRUST_PROXY: ${TRUST_PROXY:-1}
      # Origem única: o navegador vê /api/auth/refresh, então o cookie do
      # refresh token tem que viver em /api/auth (senão não é enviado e a
      # sessão cai quando o access token expira).
      REFRESH_COOKIE_PATH: ${REFRESH_COOKIE_PATH:-/api/auth}
      # Com front e API na mesma origem o navegador nem faz preflight — este
      # valor só importa se algum cliente externo chamar a API direto.
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
      # Em produção as duas precisam declarar `sslmode` (a API se recusa a subir
      # sem — ver env.validation.ts). No Neon: host com sufixo `-pooler` na
      # DATABASE_URL, host sem o sufixo na DIRECT_URL, ambas com
      # `?sslmode=require`. Com `--profile local-db`, `?sslmode=disable`.
      DATABASE_URL: ${DATABASE_URL:?defina a URL do Postgres pelo pooler, com sslmode declarado}
      DIRECT_URL: ${DIRECT_URL:?defina a URL direta do Postgres (sem pooler), com sslmode declarado}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?defina um segredo de no mínimo 32 caracteres}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?defina um segredo de no mínimo 32 caracteres}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Auto-cadastro de empresa. Desligado: o ERP da EDS tem uma empresa só.
      PUBLIC_SIGNUP_ENABLED: ${PUBLIC_SIGNUP_ENABLED:-false}
      # Integração Fiscal (Distribuição DF-e). As três são OPCIONAIS: sem a
      # chave o módulo fica indisponível e o resto do ERP segue normal.
      #
      # Precisam estar listadas aqui, e não só no .env: o `--env-file` do
      # compose alimenta a INTERPOLAÇÃO deste arquivo, não o ambiente do
      # container. Variável que não aparece nesta lista não chega ao Node.
      FISCAL_CERT_ENCRYPTION_KEY: ${FISCAL_CERT_ENCRYPTION_KEY:-}
      FISCAL_SYNC_ENABLED: ${FISCAL_SYNC_ENABLED:-false}
      FISCAL_AMBIENTE: ${FISCAL_AMBIENTE:-producao}
    # Sem `ports`: a API só é alcançável pelo nginx, dentro da rede do compose.
    # Quem quiser depurar de fora sobe com `--profile expose-api` (abaixo) ou
    # usa `docker compose exec`.
    expose:
      - '3000'
    volumes:
      # Anexos (holerites, documentos de contrato, logo). Sem este volume os
      # arquivos enviados somem no próximo deploy.
      - eds_uploads:/app/apps/api/uploads

  web:
    build:
      context: ..
      dockerfile: docker/web.Dockerfile
      args:
        # Caminho RELATIVO de propósito: nenhuma URL absoluta entra no bundle,
        # então a mesma imagem serve o túnel temporário de hoje e o domínio
        # definitivo de amanhã, sem rebuild. O nginx repassa /api para a API.
        VITE_API_URL: ${VITE_API_URL:-/api}
        # Auto-cadastro de construtora, desligado: o ERP da EDS tem uma empresa
        # só. Ligar apenas para provisionar uma base nova, junto com
        # PUBLIC_SIGNUP_ENABLED=true no serviço `api`.
        VITE_PUBLIC_SIGNUP_ENABLED: ${VITE_PUBLIC_SIGNUP_ENABLED:-false}
    restart: unless-stopped
    ports:
      - '${WEB_PORT:-8080}:80'
    depends_on:
      - api

  # Túnel temporário: publica a stack numa URL HTTPS aleatória
  # (*.trycloudflare.com) sem domínio próprio, sem conta na Cloudflare e sem
  # abrir porta no roteador. Sobe com `--profile tunnel`; a URL aparece no log:
  #
  #   docker compose -f docker/docker-compose.prod.yml --profile tunnel logs -f tunnel
  #
  # Limitações reais: a URL muda a cada restart do container e o túnel morre
  # junto com a máquina que o roda — serve para alguém testar, não para
  # produção.
  tunnel:
    profiles: ['tunnel']
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://web:80
    depends_on:
      - web

  # Túnel NOMEADO: publica a stack num domínio próprio, com TLS válido, sem IP
  # público e sem abrir porta no roteador. É o caminho para um ambiente que
  # alguém vai usar de verdade — ao contrário do `tunnel` acima, a URL é fixa e
  # sobrevive a restart.
  #
  #   docker compose -p eds-staging -f docker/docker-compose.prod.yml \
  #     --env-file apps/api/.env.staging --profile tunnel-named up -d
  #
  # Pré-requisitos, todos no painel da Cloudflare (ver docs/ambientes.md):
  #   1. o domínio precisa estar na conta (nameservers apontando para a Cloudflare)
  #   2. Zero Trust > Networks > Tunnels > Create a tunnel (tipo Cloudflared)
  #   3. em Public Hostname, apontar o subdomínio para `http://web:80`
  #   4. copiar o token e definir CLOUDFLARE_TUNNEL_TOKEN no arquivo de ambiente
  #
  # O token É uma credencial: quem o tiver publica o que quiser nesse hostname.
  # Ele mora no `.env.<ambiente>`, que é gitignorado — nunca no compose.
  #
  # Com este perfil, o `ports` do serviço `web` deixa de ser necessário: o
  # cloudflared alcança o nginx pela rede interna do compose. Mantê-lo publicado
  # no host é conveniência de depuração, não requisito.
  tunnel-named:
    profiles: ['tunnel-named']
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?defina o token em Zero Trust > Networks > Tunnels}
    depends_on:
      - web

  # Só sobe com `--profile local-db`.
  postgres:
    profiles: ['local-db']
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-eds}
    volumes:
      - eds_prod_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres}']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  eds_uploads:
  eds_prod_postgres_data:
