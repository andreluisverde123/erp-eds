<svg width="40" height="26" viewBox="0 0 40 26" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="ERP">
  <!-- Marca neutra da máscara de demonstração. Sem letra e sem referência a
       empresa nenhuma. Serve hoje só como ícone "maskable" do manifest, onde
       um desenho quase quadrado funciona melhor que um logo horizontal. -->
