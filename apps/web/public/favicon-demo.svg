<svg xmlns="http://www.w3.org/2000/svg" width="46" height="46" viewBox="0 0 46 46" fill="none" role="img" aria-label="ERP">
  <!--
    Favicon NEUTRO para gravação de demonstração.

    As mesmas três barras do logo-demo.svg, centradas num quadrado — aba de
    navegador e ícone de app são sempre quadrados, e um viewBox retangular
    sairia esmagado. O favicon real (favicon.svg) continua no repositório,
    intocado.
  -->
  <rect width="46" height="46" rx="10" fill="#3F4A55" />
  <rect x="9" y="27" width="8" height="10" rx="1.5" fill="#ffffff" opacity="0.5" />
  <rect x="19" y="19" width="8" height="18" rx="1.5" fill="#ffffff" opacity="0.75" />
  <rect x="29" y="9" width="8" height="28" rx="1.5" fill="#ffffff" />
</svg>
