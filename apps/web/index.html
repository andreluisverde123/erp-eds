<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Os marcadores %BRAND_*% são preenchidos no build com a marca da
         instalação (VITE_BRAND → apps/web/brands/<id>/). Ver brand/brand.ts. -->
    <title>%BRAND_APP_NAME%</title>
    <meta name="description" content="%BRAND_DESCRIPTION%" />
    <meta name="application-name" content="%BRAND_APP_NAME%" />
    <meta name="author" content="%BRAND_COMPANY_NAME%" />

    <!-- Sistema interno da construtora: não é site público, não tem página de
         captação e não deve aparecer em resultado de busca. -->
    <meta name="robots" content="noindex, nofollow" />

    <link rel="icon" type="image/svg+xml" href="%BRAND_FAVICON%" />
    <link rel="apple-touch-icon" href="%BRAND_FAVICON%" />
    <link rel="manifest" href="%BRAND_MANIFEST%" />

    <meta name="theme-color" content="%BRAND_COLOR%" />

    <!-- Cores da marca. `globals.css` lê estas variáveis; ficam aqui, inline,
         para valerem desde o primeiro pixel. -->
    <style id="brand-colors">%BRAND_CSS%</style>

    <!--
      Splash de carregamento. Cobre a janela entre o primeiro byte do HTML e o
      primeiro render do React, em que a tela ficaria branca. É markup e CSS
      inline de propósito: um arquivo externo chegaria depois do momento que
      este bloco existe para cobrir. O React o descarta ao montar em #root.
    -->
    <style>
      #app-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background: #ffffff;
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
      }
      #app-splash img {
        width: 56px;
        height: auto;
      }
      #app-splash span {
        font-size: 13px;
        color: #7d7e80;
      }
      @media (prefers-reduced-motion: no-preference) {
        #app-splash img {
          animation: app-splash-pulse 1.4s ease-in-out infinite;
        }
      }
      @keyframes app-splash-pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.45;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="app-splash">
        <img src="%BRAND_LOGO%" alt="%BRAND_SHORT_NAME%" />
        <span>Carregando o %BRAND_APP_NAME%…</span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
