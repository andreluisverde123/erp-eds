name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  # Lint, type-check, build e testes unitários. Nenhum deles precisa de banco:
  # o Prisma Client é gerado pela task `prisma:generate` (dependência de
  # build/type-check/test no turbo.json) e `prisma generate` não conecta.
  verify:
    name: Lint, type-check, build e testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Formatação (prettier)
        run: npm run format:check

      - name: Lint
        run: npx turbo run lint

      - name: Type-check
        run: npx turbo run type-check

      - name: Build
        run: npx turbo run build

      - name: Testes unitários
        run: npx turbo run test

  # Teste e2e da API contra um Postgres real, com as migrations aplicadas do
  # zero — é o que garante que a pasta de migrations reproduz o schema atual.
  e2e:
    name: E2E da API (Postgres + migrations)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: eds_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/eds_test
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/eds_test
      CORS_ORIGIN: http://localhost:5173
      JWT_ACCESS_SECRET: ci-access-secret-com-no-minimo-32-caracteres
      JWT_REFRESH_SECRET: ci-refresh-secret-com-no-minimo-32-caracteres
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      # `apps/api/generated/` não é versionada, então num clone limpo o Prisma
      # Client não existe — e tanto o seed quanto os testes o importam. O job de
      # lint/build gera o client de tabela pela task do turbo; aqui não passa
      # por ele, então precisa ser explícito.
      - name: Gerar Prisma Client
        run: npm run prisma:generate --workspace api

      - name: Aplicar migrations
        run: npm run prisma:deploy --workspace api

      - name: Seed
        run: npm run prisma:seed --workspace api

      - name: Testes e2e
        run: npm run test:e2e --workspace api

  # Constrói as duas imagens exatamente como um deploy faria (sem publicar).
  # Pega quebras que só aparecem no build limpo do container — dependência
  # faltando no estágio de produção, COPY apontando para caminho errado, etc.
  docker:
    name: Build das imagens Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Imagem da API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/api.Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Imagem do web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/web.Dockerfile
          push: false
          build-args: |
            VITE_API_URL=http://localhost:3000
          cache-from: type=gha
          cache-to: type=gha,mode=max
